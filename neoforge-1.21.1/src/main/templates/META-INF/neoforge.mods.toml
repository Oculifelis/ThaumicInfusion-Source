modLoader="javafml"
loaderVersion="[4,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="DrunkMafia (original Thaumic Infusion), Oculifelis (port to Thaumaturge)"
credits="Original mod by DrunkMafia (WTFPL). Thaumaturge by Leclowndu93150 and contributors."
description='''
Thaumaturgic Infusion: a port of Thaumic Infusion (Thaumcraft 4 addon by DrunkMafia) to Thaumaturge on NeoForge 1.21.1.
Infuse any block with aspect effects on the infusion altar: 39 effects from light and redstone to portals, hidden blocks,
disguised inventories and mob spawners. Also Essentia Blocks in every aspect colour and the Infusion Core stabiliser.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="thaumaturge"
    type="required"
    versionRange="${thaumaturge_version_range}"
    ordering="AFTER"
    side="BOTH"
